services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: serialreg
      POSTGRES_USER: serialreg
      POSTGRES_PASSWORD: serialreg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serialreg"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SERIALREG_DB: postgres
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: serialreg
      PGUSER: serialreg
      PGPASSWORD: serialreg
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
